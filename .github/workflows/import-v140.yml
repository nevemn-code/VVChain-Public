name: Import VVChain Public v1.0.140

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/import-v140.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "public-import-v140"
  cancel-in-progress: false

jobs:
  import-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Download verified private export
        shell: bash
        env:
          SEED_URL: "https://sdmntprkoreacentral.oaiusercontent.com/files/00000000-2498-8206-bf91-69f03eb64da0/raw?se=2026-10-01T18%3A53%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=44fbdd18-8405-5089-9c53-a754d26af7ca&skoid=1e4bb9ed-6bb5-424a-a3aa-79f21566e722&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-01T17%3A26%3A36Z&ske=2026-10-02T17%3A26%3A36Z&sks=b&skv=2026-02-06&sig=wEaUZ8XHl%2B7Zw5hM0%2BHYJteNYjg9pa%2BPdxsIBAEWXyg%3D"
        run: |
          set -euo pipefail
          curl -fsSL -L "$SEED_URL" -o /tmp/export-artifact.zip
          rm -rf /tmp/export-artifact /tmp/public-seed /tmp/public-site
          mkdir -p /tmp/export-artifact /tmp/public-seed /tmp/public-site
          unzip -q /tmp/export-artifact.zip -d /tmp/export-artifact
          INNER="$(find /tmp/export-artifact -maxdepth 2 -type f -name 'VVChain-Public-clean-seed.zip' | head -n1)"
          test -n "$INNER"
          unzip -q "$INNER" -d /tmp/public-seed

          test "$(cat /tmp/public-seed/VERSION.txt)" = "1.0.140"
          test -s /tmp/public-seed/index.html
          test -s /tmp/public-seed/README.md
          test -s /tmp/public-seed/assets/VVChain_UI_D.png
          test -s /tmp/public-seed/downloads/VVChain-v1.0.140-Windows-VST3.zip
          test ! -e /tmp/public-seed/Source
          test ! -e /tmp/public-seed/Tests
          test ! -e /tmp/public-seed/docs
          test ! -e /tmp/public-seed/vvchain-worklet.js

          rm -rf assets downloads
          mkdir -p assets downloads
          cp /tmp/public-seed/README.md README.md
          cp /tmp/public-seed/VERSION.txt VERSION.txt
          cp /tmp/public-seed/index.html index.html
          cp /tmp/public-seed/assets/VVChain_UI_D.png assets/VVChain_UI_D.png
          cp /tmp/public-seed/downloads/VVChain-v1.0.140-Windows-VST3.zip downloads/VVChain-v1.0.140-Windows-VST3.zip

          cp -a /tmp/public-seed/. /tmp/public-site/
          touch /tmp/public-site/.nojekyll

      - name: Commit source-free v1.0.140 distribution
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md VERSION.txt index.html assets downloads
          if git diff --cached --quiet; then
            echo "Public distribution already current."
          else
            git commit -m "VVChain public distribution v1.0.140"
            git push origin HEAD:main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload source-free Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/public-site

      - name: Deploy v1.0.140
        id: deployment
        uses: actions/deploy-pages@v4
