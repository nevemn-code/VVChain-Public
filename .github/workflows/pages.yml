name: Deploy VVChain Public Site

on:
  push:
    branches: [ "main" ]
    paths:
      - "index.html"
      - "README.md"
      - "VERSION.txt"
      - "assets/**"
      - "downloads/**"
      - ".nojekyll"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout public distribution only
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Verify source-free public tree
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s README.md
          test -s VERSION.txt
          test -s assets/VVChain_UI_D.png
          VERSION="$(cat VERSION.txt)"
          test -s "downloads/VVChain-v$VERSION-Windows-VST3.zip"

          test ! -e Source
          test ! -e Tests
          test ! -e docs
          test ! -e WORK_PROGRESS.md
          test ! -e PROJECT_RULES.md
          test ! -e vvchain-worklet.js

          if find . -path './.git' -prune -o -type f \( \
            -name '*.cpp' -o -name '*.cc' -o -name '*.cxx' -o \
            -name '*.h' -o -name '*.hpp' -o -name '*.py' -o \
            -name '*.js' -o -name '*.ts' -o -name '*.map' -o \
            -name 'CMakeLists.txt' \
          \) -print | grep -q .; then
            echo "ERROR: development/source file present in public repository"
            exit 1
          fi

          echo "Public source/DSP file-type secrecy gate: PASS"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
