name: Import VVChain Public v1.0.143

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/import-v143.yml"

permissions:
  contents: write

concurrency:
  group: "public-import-v143"
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SEED_URL: "https://sdmntprwestus3.oaiusercontent.com/files/00000000-0d70-81fd-93db-17e0993b09f2/raw?se=2026-10-02T03%3A03%3A53Z&sp=r&sv=2026-02-06&sr=b&scid=d1e043c2-26bd-58cd-8f37-49beaeeee316&skoid=fadb8e47-d3c7-4c79-a9c3-970d9af3b213&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-02T02%3A33%3A04Z&ske=2026-10-03T02%3A33%3A04Z&sks=b&skv=2026-02-06&sig=ba1NU1uiUrFeaeH/LI5ZX3AZQdlBx8bMNlL1a02%2BOFE%3D"
      UIC_URL: "https://sdmntprwestus3.oaiusercontent.com/files/00000000-9bb8-81fd-bd8e-58d894ab8404/raw?se=2026-10-02T03%3A04%3A10Z&sp=r&sv=2026-02-06&sr=b&scid=5498de19-fec0-53ef-ade6-8a708c1f4718&skoid=fadb8e47-d3c7-4c79-a9c3-970d9af3b213&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-02T02%3A37%3A58Z&ske=2026-10-03T02%3A37%3A58Z&sks=b&skv=2026-02-06&sig=MbJjEuVNhjFRXFNOsP3wHyDS%2BdE1MeMMUoXcwwsFESI%3D"
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Import verified v1.0.143 source-free distribution
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/vv-artifact /tmp/vv-seed /tmp/uic-artifact
          mkdir -p /tmp/vv-artifact /tmp/vv-seed /tmp/uic-artifact

          curl -fsSL -L "$SEED_URL" -o /tmp/vv-artifact.zip
          unzip -q /tmp/vv-artifact.zip -d /tmp/vv-artifact
          inner="$(find /tmp/vv-artifact -maxdepth 2 -type f -name 'VVChain-Public-clean-seed.zip' | head -n1)"
          test -n "$inner"
          unzip -q "$inner" -d /tmp/vv-seed

          test "$(cat /tmp/vv-seed/VERSION.txt)" = "1.0.143"
          test -s /tmp/vv-seed/index.html
          test -s /tmp/vv-seed/README.md
          test -s /tmp/vv-seed/assets/VVChain_UI_D.png
          test -s /tmp/vv-seed/downloads/VVChain-v1.0.143-Windows-VST3.zip
          test ! -e /tmp/vv-seed/Source
          test ! -e /tmp/vv-seed/Tests
          test ! -e /tmp/vv-seed/docs
          test ! -e /tmp/vv-seed/vvchain-worklet.js

          curl -fsSL -L "$UIC_URL" -o /tmp/uic-artifact.zip
          unzip -q /tmp/uic-artifact.zip -d /tmp/uic-artifact
          uic="$(find /tmp/uic-artifact -maxdepth 3 -type f -name 'ui_c_band2_1470x1070.png' | head -n1)"
          test -n "$uic"
          test -s "$uic"

          rm -rf assets downloads
          cp /tmp/vv-seed/index.html ./index.html
          cp /tmp/vv-seed/README.md ./README.md
          cp /tmp/vv-seed/VERSION.txt ./VERSION.txt
          cp -a /tmp/vv-seed/assets ./assets
          cp -a /tmp/vv-seed/downloads ./downloads
          cp "$uic" ./assets/VVChain_UI_C.png

          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          old='<img class="preview" src="./assets/VVChain_UI_D.png" alt="VVChain UI preview">'
          new='''<p><strong>UI_C · large spectrum + selected-band dock</strong></p>
          <img class="preview" src="./assets/VVChain_UI_C.png" alt="VVChain UI_C preview">
          <p><strong>UI_D reference</strong></p>
          <img class="preview" src="./assets/VVChain_UI_D.png" alt="VVChain UI_D preview">'''
          assert old in s
          p.write_text(s.replace(old,new),encoding="utf-8")
          PY

          rm -f .github/workflows/import-v143.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "[v1.0.143] deploy source-free UI_C preview"
          git push origin HEAD:main
